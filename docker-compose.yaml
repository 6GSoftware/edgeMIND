services:
  llm_query_server_text:
    build: 
      context: ./LLMquery-server-text
    networks:
      - edgemind_network
    ports:
      - "5000:5000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./LLMquery-server-text:/app
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - capabilities: [gpu]
    # runtime: nvidia

  llm_query_server_audio:
    build: 
      context: ./LLMquery-server-audio
    networks:
      - edgemind_network
    ports:
      - "5001:5001"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./LLMquery-server-audio:/app
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - capabilities: [gpu]
    # environment:
    #   - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True

  vector_db_server:
    build: 
      context: ./edgeMIND-vector-db-server
    networks:
      - edgemind_network
    ports:
      - "8000:8000"
    volumes:
      - ./edgeMIND-vector-db-server:/app

  image-service:
    build: ./image-processing-server
    networks:
      - edgemind_network
    ports:
      - "5002:5002"
    volumes:
      - ./image-processing-server:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # runtime: nvidia
    # environment:
    #   - NVIDIA_VISIBLE_DEVICES=all
     
  audio-service:
    build: ./audio-processing-server
    container_name: edgemind-audio-service
    networks:
      - edgemind_network
    ports:
      - "5003:5003"
    volumes:
      - ./audio-processing-server:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    # environment:
    #   - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
    #   - NVIDIA_VISIBLE_DEVICES=all
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - capabilities: [gpu]
    # runtime: nvidia 

  pdf-service:
    build: ./pdf-processing-server
    networks:
      - edgemind_network
    ports:
      - "5004:5004"
    volumes:
      - ./pdf-processing-server:/app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
            
  situational_awareness_server:
    build:
      context: ./situational-awareness-server
    networks:
      - edgemind_network
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "6501:6501"
    volumes:
      - ./situational-awareness-server:/app

networks:
  edgemind_network:
    external: true
    driver: bridge

