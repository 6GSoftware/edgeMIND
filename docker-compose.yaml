services:
  llm_query_server_text:
    build: 
      context: ./LLMquery-server-text
    #volumes:
    #  - type: bind
    #    source: /home/<user>/.cache/huggingface
    #    target: /root/.cache/huggingface
    networks:
      - edgemind_network
    ports:
      - "5000:5000"
      - "6000:6000"

  llm_query_server_audio:
    build: 
      context: ./LLMquery-server-audio
    #volumes:
    #  - type: bind
    #    source: /home/<user>/.cache/huggingface
    #    target: /root/.cache/huggingface
    networks:
      - edgemind_network
    ports:
      - "5001:5001"
      - "6001:6001"

  vector_db_server:
    build: 
      context: ./edgeMIND-vector-db-server
    networks:
      - edgemind_network
    ports:
      - "8000:8000"

networks:
  edgemind_network:
    external: true
    driver: bridge

