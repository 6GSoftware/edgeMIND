services:
  llm_query_server_text:
    build: 
      context: ./LLMquery-server-text
    networks:
      - edgemind_network
    ports:
      - "5000:5000"
      #- "6000:6000"
    volumes:
      - ./LLMquery-server-text:/app

  llm_query_server_audio:
    build: 
      context: ./LLMquery-server-audio
    networks:
      - edgemind_network
    ports:
      - "5001:5001"
      #- "6001:6001"
    volumes:
      - ./LLMquery-server-audio:/app
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
    runtime: nvidia

  vector_db_server:
    build: 
      context: ./edgeMIND-vector-db-server
    networks:
      - edgemind_network
    ports:
      - "8000:8000"
    volumes:
      - ./edgeMIND-vector-db-server:/app

  image-service:
    build: ./image-processing-server
    networks:
      - edgemind_network
    ports:
      - "5002:5002"
    volumes:
      - ./image-processing-server:/app
     
  audio-service:
    build: ./audio-processing-server
    networks:
      - edgemind_network
    ports:
      - "5003:5003"
    volumes:
      - ./audio-processing-server:/app

  pdf-service:
    build: ./pdf-processing-server
    networks:
      - edgemind_network
    ports:
      - "5004:5004"
    volumes:
      - ./pdf-processing-server:/app
    env_file:
      - .env
      
  situational_awareness_server:
    build:
      context: ./situational-awareness-server
    networks:
      - edgemind_network
    ports:
      - "6500:6500"
    volumes:
      - ./situational-awareness-server:/app

networks:
  edgemind_network:
    external: true
    driver: bridge

