name: CI Build - Split Services

on:
  push:
    branches: [ci-test]
  pull_request:
    branches: [ci-test]

jobs:
  build-image-service:
    name: Build Image Service
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Build Docker image
      run: docker build -t image-service ./image-processing-server

    - name: Run container
      run: docker run -d -p 5002:5002 --name image-service image-service

    - name: Wait for service
      run: |
        for i in {1..30}; do
          echo "Waiting for service... attempt $i"
          if curl -f http://localhost:5002/health; then
            echo "Service is healthy!"
            exit 0
          fi
          sleep 1
        done
        echo "Service did not become ready in time."
        exit 1

    - name: Install test dependencies
      run: pip install requests

    - name: Run smoke test
      run: python tests/smoke_test.py

  build-audio-service:
    name: Build Audio Service
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - run: docker build -t audio-service ./audio-processing-server

  build-pdf-service:
    name: Build PDF Service
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - run: docker build -t pdf-service ./pdf-processing-server

  build-vector-db:
    name: Build Vector DB Server
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - run: docker build -t vector-db ./edgeMIND-vector-db-server

  build-llm-query-text:
    name: Build LLM Query Text
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - run: docker build -t llm-query-text ./LLMquery-server-text

  build-llm-query-audio:
    name: Build LLM Query Audio
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - run: docker build -t llm-query-audio ./LLMquery-server-audio

  build-situational-awareness:
    name: Build Situational Awareness Server
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - run: docker build -t situational-awareness ./situational-awareness-server
