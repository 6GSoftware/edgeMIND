apiVersion: apps/v1
kind: Deployment
metadata:
  name: audio-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: audio-service
  template:
    metadata:
      labels:
        app: audio-service
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app: audio-service
            topologyKey: "kubernetes.io/hostname"
      #nodeSelector:
      #  <KEY>: <VALUE>  # Here put any label + its value you have given to any node(s)
      containers:
      - name: audio-service
        image: registry.local:4000/edgemind/audio-service:latest
        ports:
        - containerPort: 5003
---
apiVersion: v1
kind: Service
metadata:
  name: audio-service
spec:
  type: ClusterIP
  selector:
    app: audio-service
  ports:
  - port: 80
    targetPort: 5003