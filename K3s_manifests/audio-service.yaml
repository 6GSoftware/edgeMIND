apiVersion: apps/v1
kind: Deployment
metadata:
  name: edgemind-audio-service   # replace with a custom name for the service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: edgemind-audio-service    # here (and below) use the same name as above for metadata.name
  template:
    metadata:
      labels:
        app: edgemind-audio-service
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app: edgemind-audio-service
            topologyKey: "kubernetes.io/hostname"
      #nodeSelector:
      #  <KEY>: <VALUE>  # Here put any label + its value you have given to any node(s)
      containers:
      - name: edgemind-audio-service
        image: registry.local:4000/edgemind-audio-service   # replace with the name of your service's container image
        ports:
        - containerPort: 5003   # replace with the container's internal port
---
apiVersion: v1
kind: Service
metadata:
  name: edgemind-audio-service
spec:
  type: NodePort
  selector:
    app: edgemind-audio-service
  ports:
  - port: 5003          # replace with the container's external port
    targetPort: 5003    # replace with the container's internal port