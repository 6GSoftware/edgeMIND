apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-image-gen-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-image-gen-service
  template:
    metadata:
      labels:
        app: llm-image-gen-service
    spec:
      runtimeClassName: nvidia
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: processor
                operator: In
                values:
                - gpu
      containers:
      - name: llm-image-gen-service
        image: registry.local:4000/edgemind/llm-image-gen-service-2
        ports:
        - containerPort: 5001
        resources:
          limits:
            nvidia.com/gpu: 1 # requesting 1 GPU
---
apiVersion: v1
kind: Service
metadata:
  name: llm-image-gen-service
spec:
  type: ClusterIP
  selector:
    app: llm-image-gen-service
  ports:
  - port: 80
    targetPort: 5001
    #nodePort: 30001