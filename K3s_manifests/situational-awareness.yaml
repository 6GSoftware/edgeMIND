apiVersion: apps/v1
kind: Deployment
metadata:
  name: situational-awareness
spec:
  replicas: 1
  selector:
    matchLabels:
      app: situational-awareness
  template:
    metadata:
      labels:
        app: situational-awareness
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app: situational-awareness
            topologyKey: "kubernetes.io/hostname"
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: computing-power
                    operator: In
                    values: ["medium"]
      containers:
      - name: situational-awareness
        image: registry.local:4000/edgemind/situational-awareness:latest
        ports:
        - containerPort: 6501
---
apiVersion: v1
kind: Service
metadata:
  name: situational-awareness
spec:
  selector:
    app: situational-awareness
  ports:
  - port: 6501
    targetPort: 6501
