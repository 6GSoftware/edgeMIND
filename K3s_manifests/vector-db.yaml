apiVersion: apps/v1
kind: Deployment
metadata:
  name: vector-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vector-db
  template:
    metadata:
      labels:
        app: vector-db
    spec:
      nodeSelector:
        dedicated: main
      containers:
      - name: vector-db
        image: localhost:5000/vector-db:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
        volumeMounts:
        - name: rapl
          mountPath: /sys/class/powercap
          readOnly: true
        - name: captures
          mountPath: /captures
        securityContext:
          privileged: true
          runAsUser: 0

      - name: packet-capture
        image: nicolaka/netshoot
        securityContext:
          capabilities:
            add: ["NET_ADMIN", "NET_RAW"]
        command: ["sh", "-c", "sleep infinity"]
        volumeMounts:
        - name: captures
          mountPath: /captures
          
      volumes:
      - name: rapl
        hostPath:
          path: /sys/class/powercap
          type: Directory
      - name: captures
        emptyDir: {}  
---
apiVersion: v1
kind: Service
metadata:
  name: vector-db
spec:
  selector:
    app: vector-db
  type: NodePort
  ports:
  - port: 8000
    targetPort: 8000
    nodePort: 30800