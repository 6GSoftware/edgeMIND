apiVersion: apps/v1
kind: Deployment
metadata:
  name: vector-db
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vector-db
  template:
    metadata:
      labels:
        app: vector-db
    spec:
      nodeSelector:
        role: worker
        # image-node: "true"
      containers:
      - name: vector-db
        image: registry.local:4000/vector-db:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: vector-db
spec:
  selector:
    app: vector-db
  type: NodePort
  ports:
  - port: 8000
    targetPort: 8000
    nodePort: 30800