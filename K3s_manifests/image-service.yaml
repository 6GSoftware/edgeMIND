apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-service
spec:
  replicas: 1 # Modify
  strategy:
    type: Recreate 
  selector:
    matchLabels:
      app: image-service
  template:
    metadata:
      labels:
        app: image-service
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - image-service
                topologyKey: kubernetes.io/hostname
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - <add node name> # Modify

      containers:
      - name: image-service
        image: registry.local:4000/image-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5002
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName

        volumeMounts:
        - name: edgemind-data
          mountPath: /data
          readOnly: true
        - name: crictl-bin
          mountPath: /usr/local/bin/crictl

      volumes:
      - name: edgemind-data
        hostPath:
          path: /var/lib/edgemind
          type: DirectoryOrCreate

      - name: crictl-bin
        hostPath:
          path: /var/lib/rancher/k3s/data/current/bin/crictl
          type: File
---
apiVersion: v1
kind: Service
metadata:
  name: image-service
spec:
  type: NodePort
  selector:
    app: image-service
  ports:
  - port: 5002
    targetPort: 5002
    nodePort: 30502