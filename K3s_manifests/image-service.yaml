apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: image-service
  template:
    metadata:
      labels:
        app: image-service
    spec:
      runtimeClassName: nvidia # Remove if you only use cpu
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app: image-service
            topologyKey: "kubernetes.io/hostname"

        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
              - key: nvidia.com/gpu
                operator: Exists

      containers:
      - name: image-service
        image: registry.local:4000/edgemind/image-service:latest
        ports:
        - containerPort: 5002
        resources:  # Remove if you only use cpu
          limits: # Remove if you only use cpu
            nvidia.com/gpu: 1 # Remove if you only use cpu
---
apiVersion: v1
kind: Service
metadata:
  name: image-service
spec:
  type: ClusterIP
  selector:
    app: image-service
  ports:
  - port: 80
    targetPort: 5002