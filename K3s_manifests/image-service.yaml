apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: image-service
  template:
    metadata:
      labels:
        app: image-service
    spec:
      nodeSelector:
        dedicated: gpu

      containers:
      # --- MAIN CONTAINER ---
      - name: image-service
        image: registry.local:5000/image-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5002

        securityContext:
          privileged: true          # REQUIRED for crictl to use containerd.sock
          runAsUser: 0
          capabilities:
            add:
              - NET_ADMIN
              - NET_RAW

        volumeMounts:
        - name: rapl
          mountPath: /sys/class/powercap
          readOnly: true
        - name: results2
          mountPath: /results2
        - name: edgemind-data
          mountPath: /data
          readOnly: true
        - name: crictl-bin
          mountPath: /usr/local/bin/crictl
        - name: containerd-k3s-dir
          mountPath: /run/k3s/containerd
        - name: containerd-socket
          mountPath: /run/containerd/containerd.sock

      # --- PACKET CAPTURE SIDECAR ---
      - name: packet-capture
        image: nicolaka/netshoot
        securityContext:
          capabilities:
            add:
              - NET_ADMIN
              - NET_RAW
        command: ["sh", "-c", "sleep infinity"]
        volumeMounts:
        - name: captures
          mountPath: /captures

      volumes:
      - name: rapl
        hostPath:
          path: /sys/class/powercap
          type: Directory

      - name: results2
        hostPath:
          path: /home/sixgsoftware/Documents/eval-files
          type: DirectoryOrCreate

      - name: edgemind-data
        hostPath:
          path: /var/lib/edgemind
          type: DirectoryOrCreate

      # crictl & containerd mounts (added back)
      - name: crictl-bin
        hostPath:
          path: /var/lib/rancher/k3s/data/current/bin/crictl
          type: File

      - name: containerd-k3s-dir
        hostPath:
          path: /run/k3s/containerd
          type: Directory

      - name: containerd-socket
        hostPath:
          path: /run/containerd/containerd.sock
          type: Socket

      - name: captures
        emptyDir: {}
