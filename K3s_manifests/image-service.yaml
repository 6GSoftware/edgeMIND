apiVersion: apps/v1
kind: Deployment
metadata:
  name: image-service   # replace with a custom name for the service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: image-service    # here (and below) use the same name as above for metadata.name
  template:
    metadata:
      labels:
        app: image-service
    spec:
      hostNetwork: false
      hostPID: true
      nodeSelector:
        dedicated: main
        # dedicated: ideapad
      # affinity:
      #   podAntiAffinity:
      #     requiredDuringSchedulingIgnoredDuringExecution:
      #     - labelSelector:
      #         matchLabels:
      #           app: image-service
      #       topologyKey: "kubernetes.io/hostname"
      #nodeSelector:
      #  <KEY>: <VALUE>  # Here put any label + its value you have given to any node(s)
      containers:
      - name: image-service
        image: localhost:5000/image-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5002
        volumeMounts:
        - name: rapl
          mountPath: /sys/class/powercap
          readOnly: true
        - name: results
          mountPath: /results
        - name: edgemind-data
          mountPath: /data
          readOnly: true 
        - name: crictl-bin
          mountPath: /usr/local/bin/crictl
        - name: containerd-k3s-dir
          mountPath: /run/k3s/containerd
        - name: containerd-socket-default
          mountPath: /run/containerd/containerd.sock
        securityContext:
          privileged: true
          runAsUser: 0
      - name: packet-capture
        image: nicolaka/netshoot
        securityContext:
          capabilities:
            add: ["NET_ADMIN", "NET_RAW"]
        command: ["sh", "-c", "sleep infinity"]
        volumeMounts:
        - name: captures
          mountPath: /captures

      volumes:
      - name: captures
        emptyDir: {}

      - name: rapl
        hostPath:
          path: /sys/class/powercap
          type: Directory

      - name: results
        hostPath:
          path: /home/asdasd/6g/edgeMIND/image-processing-server/results
          type: DirectoryOrCreate

      - name: edgemind-data
        hostPath:
          path: /var/lib/edgemind
          type: DirectoryOrCreate

      - name: crictl-bin
        hostPath:
          path: /var/lib/rancher/k3s/data/current/bin/crictl
          type: File

      - name: containerd-k3s-dir
        hostPath:
          path: /run/k3s/containerd
          type: Directory

      - name: containerd-socket-default
        hostPath:
          path: /run/containerd/containerd.sock
          type: Socket
---
apiVersion: v1
kind: Service
metadata:
  name: image-service
spec:
  type: NodePort
  selector:
    app: image-service
  ports:
  - port: 5002          # replace with the container's external port
    targetPort: 5002    # replace with the container's internal port
    nodePort: 30806