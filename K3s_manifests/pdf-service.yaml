apiVersion: apps/v1
kind: Deployment
metadata:
  name: edgemind-pdf-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: edgemind-pdf-service
  template:
    metadata:
      labels:
        app: edgemind-pdf-service
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                app: edgemind-pdf-service
            topologyKey: "kubernetes.io/hostname"
      #nodeSelector:
      #  <KEY>: <VALUE>  # Here put any label + its value you have given to any node(s)
      containers:
      - name: edgemind-pdf-service
        image: registry.local:4000/edgemind/pdf-service:latest
        ports:
        - containerPort: 5004
        envFrom:
        - secretRef:
            name: pdf-service-secret # sudo kubectl create secret generic pdf-service-secret --from-env-file=.env
---
apiVersion: v1
kind: Service
metadata:
  name: edgemind-pdf-service
spec:
  type: NodePort
  selector:
    app: edgemind-pdf-service
  ports:
  - port: 5004
    targetPort: 5004
    nodePort: 30014