apiVersion: apps/v1
kind: Deployment
metadata:
  name: vector-db-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vector-db-server
  template:
    metadata:
      labels:
        app: vector-db-server
    spec:
      containers:
      - name: vector-db-server
        image: registry.local:4000/edgemind/vector-db-server
        ports:
        - containerPort: 8000
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchExpressions:
                  - key: computing-power
                    operator: In
                    values: ["medium"]
---
apiVersion: v1
kind: Service
metadata:
  name: vector-db-server
spec:
  selector:
    app: vector-db-server
  ports:
  - port: 8000
    targetPort: 8000
