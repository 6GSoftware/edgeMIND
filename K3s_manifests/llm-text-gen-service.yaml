apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-text-gen-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-text-gen-service
  template:
    metadata:
      labels:
        app: llm-text-gen-service
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - llm-text-gen-service
                topologyKey: kubernetes.io/hostname 
      nodeSelector:
        role: worker
        # image-node: "true"
      containers:
      - name: llm-text-gen-service
        image: registry.local:4000/llm-text-gen-service:latest
        ports:
        - containerPort: 5007

        # resources:
        #   requests:
        #     cpu: "500m"
        #     memory: "500Mi"
        #   limits:
        #     cpu: "2"

        volumeMounts:

        - name: crictl-bin
          mountPath: /usr/local/bin/crictl
        - name: containerd-k3s-dir
          mountPath: /run/k3s/containerd
        - name: containerd-socket
          mountPath: /run/containerd/containerd.sock

        - name: llm-models
          mountPath: /models
          readOnly: true

        - name: rapl
          mountPath: /sys/class/powercap
          readOnly: true

      - name: packet-capture
        image: nicolaka/netshoot
        securityContext:
          capabilities:
            add: ["NET_ADMIN", "NET_RAW"]
        command: ["sh", "-c", "sleep infinity"]
        volumeMounts:
        - name: captures
          mountPath: /captures

      volumes:
      
      - name: crictl-bin
        hostPath:
          path: /var/lib/rancher/k3s/data/current/bin/crictl
          type: File

      - name: containerd-k3s-dir
        hostPath:
          path: /run/k3s/containerd
          type: Directory

      - name: containerd-socket
        hostPath:
          path: /run/containerd/containerd.sock
          type: Socket

      - name: captures
        emptyDir: {}

      - name: llm-models
        hostPath:
          path: /var/lib/llm-models/models
          type: Directory
          
      - name: rapl
        hostPath:
          path: /sys/class/powercap
          type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: llm-text-gen-service
spec:
  type: NodePort
  # externalTrafficPolicy: Local
  selector:
    app: llm-text-gen-service
  ports:
  - port: 5007
    targetPort: 5007
    nodePort: 30500
---
