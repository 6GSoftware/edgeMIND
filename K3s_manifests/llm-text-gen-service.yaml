apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-text-gen-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-text-gen-service
  template:
    metadata:
      labels:
        app: llm-text-gen-service
    spec:
      # affinity:
      #   nodeAffinity:
      #     requiredDuringSchedulingIgnoredDuringExecution:
      #       nodeSelectorTerms:
      #       - matchExpressions:
      #         - key: computing-power
      #           operator: In
      #           values:
      #           - high 
      nodeSelector:
        dedicated: gpu
      containers:
      - name: llm-text-gen-service
        image: registry.local:5000/llm-text-gen-service:latest
        ports:
        - containerPort: 5007
        volumeMounts:

        - name: crictl-bin
          mountPath: /usr/local/bin/crictl
        - name: containerd-k3s-dir
          mountPath: /run/k3s/containerd
        - name: containerd-socket
          mountPath: /run/containerd/containerd.sock

        - name: results2
          mountPath: /results2

        - name: llm-models
          mountPath: /models
          readOnly: true

        - name: rapl
          mountPath: /sys/class/powercap
          readOnly: true

        - name: edgemind-data
          mountPath: /data
          readOnly: true
        securityContext:
          privileged: true
          runAsUser: 0
      - name: packet-capture
        image: nicolaka/netshoot
        securityContext:
          capabilities:
            add: ["NET_ADMIN", "NET_RAW"]
        command: ["sh", "-c", "sleep infinity"]
        volumeMounts:
        - name: captures
          mountPath: /captures

      volumes:
      
      - name: crictl-bin
        hostPath:
          path: /var/lib/rancher/k3s/data/current/bin/crictl
          type: File

      - name: containerd-k3s-dir
        hostPath:
          path: /run/k3s/containerd
          type: Directory

      - name: containerd-socket
        hostPath:
          path: /run/containerd/containerd.sock
          type: Socket

      - name: results2
        hostPath:
          path: /home/sixgsoftware/Documents/eval-files
          type: DirectoryOrCreate

      - name: captures
        emptyDir: {}

      - name: llm-models
        hostPath:
          path: /home/sixgsoftware/6g/models
          type: Directory
          
      - name: rapl
        hostPath:
          path: /sys/class/powercap
          type: Directory

      - name: edgemind-data
        hostPath:
          path: /var/lib/edgemind
          type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: llm-text-gen-service
spec:
  type: NodePort
  selector:
    app: llm-text-gen-service
  ports:
  - port: 5007
    targetPort: 5007
    nodePort: 30500
