apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-text-gen-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: llm-text-gen-service
  template:
    metadata:
      labels:
        app: llm-text-gen-service
    spec:
      # affinity:
      #   nodeAffinity:
      #     requiredDuringSchedulingIgnoredDuringExecution:
      #       nodeSelectorTerms:
      #       - matchExpressions:
      #         - key: computing-power
      #           operator: In
      #           values:
      #           - high 
      nodeSelector:
        dedicated: main
      containers:
      - name: llm-text-gen-service
        image: localhost:5000/llm-text-gen-service:latest
        ports:
        - containerPort: 5007
        volumeMounts:
        - name: llm-model
          mountPath: /app/saved_LLM_model
          readOnly: true
        - name: rapl
          mountPath: /sys/class/powercap
          readOnly: true
        - name: results
          mountPath: /results
        - name: edgemind-data
          mountPath: /data
          readOnly: true
        securityContext:
          privileged: true
          runAsUser: 0
      - name: packet-capture
        image: nicolaka/netshoot
        securityContext:
          capabilities:
            add: ["NET_ADMIN", "NET_RAW"]
        command: ["sh", "-c", "sleep infinity"]
        volumeMounts:
        - name: captures
          mountPath: /captures

      volumes:
      - name: captures
        emptyDir: {}
      - name: llm-model
        hostPath:
          path: /home/asdasd/6g/edgeMIND/models/saved_LLM_model
          type: Directory
      - name: rapl
        hostPath:
          path: /sys/class/powercap
          type: Directory
      - name: results
        hostPath:
          path: /home/asdasd/6g/edgeMIND/LLMquery-server-text/results
          type: DirectoryOrCreate
      - name: edgemind-data
        hostPath:
          path: /var/lib/edgemind
          type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: llm-text-gen-service
spec:
  type: NodePort
  selector:
    app: llm-text-gen-service
  ports:
  - port: 5007
    targetPort: 5007
    nodePort: 30500
