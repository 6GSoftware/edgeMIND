apiVersion: apps/v1
kind: Deployment
metadata:
  name: llm-text-gen-service
spec:
  replicas: 1   # Modify
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: llm-text-gen-service
  template:
    metadata:
      labels:
        app: llm-text-gen-service
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - llm-text-gen-service
                topologyKey: kubernetes.io/hostname 
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                - <add node name> # Modify

      containers:
      - name: llm-text-gen-service
        image: registry.local:4000/llm-text-gen-service:latest
        ports:
        - containerPort: 5007

        volumeMounts:

        - name: crictl-bin
          mountPath: /usr/local/bin/crictl
        - name: llm-models
          mountPath: /models
          readOnly: true

      volumes:
      - name: crictl-bin
        hostPath:
          path: /var/lib/rancher/k3s/data/current/bin/crictl
          type: File

      - name: llm-models
        hostPath:
          path: /var/lib/llm-models/models
          type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: llm-text-gen-service
spec:
  type: NodePort
  externalTrafficPolicy: Cluster
  selector:
    app: llm-text-gen-service
  ports:
  - port: 5007
    targetPort: 5007
    nodePort: 30500